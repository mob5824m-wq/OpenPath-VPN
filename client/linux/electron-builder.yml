appId: com.openpath.vpn.linux
productName: OpenPath VPN
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  output: dist-installer
  buildResources: installers
files:
  - dist/**
  - cli/dist/**
  - installers/**
  - package.json
extraResources:
  - from: ../desktop/electron/device-vpn.js
    to: native/device-vpn.js
  - from: ../desktop/electron/device-ipc.js
    to: native/device-ipc.js
linux:
  category: Network
  maintainer: OpenPath Team <team@openpath.vpn>
  target: [deb, rpm, AppImage]
  icon: ../../assets/icon-512.png
  desktop:
    Name: OpenPath VPN
    Comment: WebSocket sessions and optional WireGuard device VPN
    StartupWMClass: openpath
  executableName: openpath-gui
deb:
  depends: [libnss3, libxss1, libasound2, libxtst6]
rpm:
  depends: [nss, libXScrnSaver, alsa-lib]
appImage:
  artifactName: "OpenPath-${version}.AppImage"
nsis: {}
dmg: {}
