services:
  server:
    build: ./
    dockerfile: Dockerfile
    expose:
      - "4434"
    ports:
      - "127.0.0.1:4434:4434"
    environment:
      PORT: 4434
      HOST: 0.0.0.0
      ROLE: sub
      MAIN_URL: ${MAIN_URL:-http://host.docker.internal:4433}
      DUCKDNS_DOMAIN: ${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}
      SUB_DUCKDNS_DOMAIN: ${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      DEMO_PSK: ${DEMO_PSK:-demo-student-key-do-not-use-prod}
      OPS_PATH: ${OPS_PATH:-/ops}
      HOST_NAME: ${HOST_NAME:-OpenPath Sub}
      HOST_REGION: ${HOST_REGION:-home}
      HOST_COUNTRY: ${HOST_COUNTRY:-CA}
      PUBLIC_HOST: ${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}.duckdns.org
      PUBLIC_WSS: wss://${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}.duckdns.org/ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4434/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DUCKDNS_DOMAIN: ${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}
      SUB_DUCKDNS_DOMAIN: ${SUB_DUCKDNS_DOMAIN:-${DUCKDNS_DOMAIN:-openpath-sub1}}
      CADDY_DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - ./Caddyfile.sub.duckdns:/etc/caddy/Caddyfile:ro
      - caddy_data_sub:/data
      - caddy_config_sub:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data_sub:
  caddy_config_sub:

# Each SUB host runs this compose on its own machine/VPS:
#   cp .env.duckdns.sub.example .env.sub
#   # edit .env.sub: SUB_DUCKDNS_DOMAIN=openpath-sub1, DUCKDNS_TOKEN=xxx, MAIN_URL=https://openpath-main.duckdns.org, HOST_NAME="Montreal"
#   docker compose --env-file .env.sub -f docker-compose.sub.duckdns.yml up -d --build
#
# Then main's GET /api/hosts will include:
#   { id:"sub-openpath-sub1...", wssUrl:"wss://openpath-sub1.duckdns.org/ops", duckdnsUrl:"https://openpath-sub1.duckdns.org" }
#
# If subs are on same host for testing, change ports to avoid conflict:
#   PORT=4435 docker compose -f docker-compose.sub.duckdns.yml up -d
