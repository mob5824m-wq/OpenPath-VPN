name: Native Installers

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to build"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to check out and build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 native app
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Build against glibc 2.35 for Ubuntu 22.04-compatible binaries.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and Qt dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip python3-dev build-essential \
            libglib2.0-0 libfontconfig1 libfreetype6 libgl1 libegl1 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Install native build dependencies
        run: python3 -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: client/native
        run: python3 -m unittest discover -s client/native/tests -v
      - id: version
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python3 client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          run_checked() {
            set +e
            "$@" 2>&1 | tee /tmp/openpath-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error::Native build command failed: $(tail -n 15 /tmp/openpath-build.log | tr '\n\r' '  ')"
              exit "$status"
            fi
          }
          run_checked python3 client/native/make_icons.py
          run_checked python3 -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          run_checked client/native/dist/OpenPath/OpenPath --smoke-test
      - name: Package deb and portable archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.debian_version }}
        run: bash client/native/package_linux.sh "$VERSION" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-linux-x64
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.deb
            client/native/dist-installer/*.tar.gz

  windows:
    name: Windows x64 native app
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install native build dependencies
        run: python -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\client\native"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s client/native/tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\openpath-tests.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP\openpath-tests.log" -Tail 30) -join ' '
            Write-Output "::error::Native tests failed: $tail"
            exit $code
          }
      - id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python client/native/make_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "$pwd\client\native\dist\OpenPath\OpenPath.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Build installer and portable archive
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          New-Item -ItemType Directory -Force client/native/dist-installer | Out-Null
          $dir = (Resolve-Path client/native/dist/OpenPath).Path
          $out = "$pwd\client\native\dist-installer\openpath-$($env:TAG)-windows-x64.exe"
          & $nsis "/DAPP_VERSION=$env:VERSION" "/DAPP_DIR=$dir" "/DOUTPUT=$out" client/native/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path client/native/dist/OpenPath -DestinationPath "client/native/dist-installer/openpath-$($env:TAG)-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-windows-x64
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.exe
            client/native/dist-installer/*.zip

  macos:
    name: macOS ${{ matrix.arch }} native app
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            python_arch: arm64
          - os: macos-15-intel
            arch: x64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Install native build dependencies
        run: python -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: client/native
        run: python -m unittest discover -s client/native/tests -v
      - id: version
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native application
        env:
          QT_QPA_PLATFORM: offscreen
          OPENPATH_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          python client/native/make_icons.py
          python -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          client/native/dist/OpenPath.app/Contents/MacOS/OpenPath --smoke-test
      - name: Package DMG and zip
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: bash client/native/package_macos.sh "$TAG" "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.dmg
            client/native/dist-installer/*.zip
