name: Native Installers

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to build"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to check out and build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  stealth-linux:
    name: Linux Stealth relay traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireguard-tools iproute2 iputils-ping
          npm ci --prefix server
          python -m pip install websockets==15.0.1
      - name: Verify actual WireGuard traffic through TLS and failure behavior
        shell: bash
        run: sudo env "PATH=$PATH" unshare -mn bash scripts/test-stealth-linux.sh

  stealth-windows:
    name: Windows Stealth relay handshake
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WireGuard and relay test dependencies
        shell: pwsh
        run: |
          choco install wireguard --version=1.1.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify a real WireGuardNT handshake through TLS
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\client\native"
          python scripts/test-stealth-windows.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\stealth-windows.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP\stealth-windows.log" -Tail 25) -join ' '
            Write-Output "::error::Windows Stealth handshake failed: $tail"
            exit $code
          }

  stealth-macos:
    name: macOS Stealth relay handshake
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WireGuard and relay test dependencies
        run: |
          brew list wireguard-tools >/dev/null 2>&1 || brew install wireguard-tools
          npm ci --prefix server
          python -m pip install websockets==15.0.1
      - name: Verify a real wireguard-go handshake through TLS
        shell: bash
        run: |
          set -uo pipefail
          PYTHONPATH=client/native python scripts/test-stealth-macos.py 2>&1 | tee "$RUNNER_TEMP/stealth-macos.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS Stealth handshake failed: $(tail -n 25 "$RUNNER_TEMP/stealth-macos.log" | tr '\n\r' '  ')"
            exit "$status"
          fi

  linux:
    name: Linux x64 native app
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Build against glibc 2.35 for Ubuntu 22.04-compatible binaries.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and Qt dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip python3-dev build-essential \
            libglib2.0-0 libfontconfig1 libfreetype6 libgl1 libegl1 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Install native build dependencies
        run: python3 -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: client/native
        run: python3 -m unittest discover -s client/native/tests -v
      - id: version
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python3 client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          run_checked() {
            set +e
            "$@" 2>&1 | tee /tmp/openpath-build.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              echo "::error::Native build command failed: $(tail -n 15 /tmp/openpath-build.log | tr '\n\r' '  ')"
              exit "$status"
            fi
          }
          run_checked python3 client/native/make_icons.py
          run_checked python3 -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          run_checked client/native/dist/OpenPath/OpenPath --smoke-test
      - name: Package deb and portable archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.debian_version }}
        run: bash client/native/package_linux.sh "$VERSION" "$TAG"
      - name: Install and smoke-test the Debian package
        env:
          TAG: ${{ steps.version.outputs.tag }}
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireguard-tools iproute2 pkexec openresolv
          dpkg -i "client/native/dist-installer/openpath-$TAG-linux-amd64.deb"
          test -f /usr/share/applications/openpath-vpn.desktop
          /opt/openpath/OpenPath --smoke-test
          dpkg -r openpath-vpn
          test ! -e /opt/openpath/OpenPath
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-linux-x64
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.deb
            client/native/dist-installer/*.tar.gz

  windows:
    name: Windows x64 native app
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install native build dependencies
        run: python -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\client\native"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s client/native/tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\openpath-tests.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content "$env:RUNNER_TEMP\openpath-tests.log" -Tail 30) -join ' '
            Write-Output "::error::Native tests failed: $tail"
            exit $code
          }
      - id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python client/native/make_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "$pwd\client\native\dist\OpenPath\OpenPath.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Build installer and portable archive
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          New-Item -ItemType Directory -Force client/native/dist-installer | Out-Null
          $dir = (Resolve-Path client/native/dist/OpenPath).Path
          $out = "$pwd\client\native\dist-installer\openpath-$($env:TAG)-windows-x64.exe"
          & $nsis "/DAPP_VERSION=$env:VERSION" "/DAPP_DIR=$dir" "/DOUTPUT=$out" client/native/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path client/native/dist/OpenPath -DestinationPath "client/native/dist-installer/openpath-$($env:TAG)-windows-x64.zip"
      - name: Install, launch and uninstall the Windows app
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $installDir = "$env:RUNNER_TEMP\OpenPathInstallerTest"
          $installer = "$pwd\client\native\dist-installer\openpath-$($env:TAG)-windows-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $app = "$installDir\OpenPath.exe"
          if (!(Test-Path $app)) { throw 'Installer did not create OpenPath.exe' }
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed app smoke test exited with $($process.ExitCode)" }
          $process = Start-Process -FilePath "$installDir\Uninstall.exe" -ArgumentList @('/S', "_?=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
          if (Test-Path $app) { throw 'Uninstaller did not remove OpenPath.exe' }
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-windows-x64
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.exe
            client/native/dist-installer/*.zip

  macos:
    name: macOS ${{ matrix.arch }} native app
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            python_arch: arm64
          - os: macos-15-intel
            arch: x64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Install native build dependencies
        run: python -m pip install -r client/native/requirements.txt
      - name: Test native backend and Qt controls
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: client/native
        run: python -m unittest discover -s client/native/tests -v
      - id: version
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
        run: python client/native/version.py "$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test native application
        env:
          QT_QPA_PLATFORM: offscreen
          OPENPATH_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          python client/native/make_icons.py
          python -m PyInstaller --noconfirm --clean --distpath client/native/dist --workpath client/native/build/pyinstaller client/native/OpenPath.spec
          client/native/dist/OpenPath.app/Contents/MacOS/OpenPath --smoke-test
      - name: Package DMG and zip
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: bash client/native/package_macos.sh "$TAG" "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-native-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            client/native/dist-installer/*.dmg
            client/native/dist-installer/*.zip
