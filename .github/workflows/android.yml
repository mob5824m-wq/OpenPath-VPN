name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Optional release tag to check out and include in the APK name
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Android native app and test-signed APK
    # The hosted image includes the Android SDK and licenses. Pinning the image
    # also avoids an unexpected Android toolchain change during label migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not configured}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || { echo '::error::Android platform 36 is missing'; exit 1; }
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || { echo '::error::Android build tools 36.0.0 are missing'; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK build
        shell: bash
        working-directory: client/android
        run: |
          set -uo pipefail
          status=0
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleRelease > "$RUNNER_TEMP/openpath-android.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/openpath-android.log"
          if [ "$status" -ne 0 ]; then
            # Logs may be unavailable to API consumers. Put useful compiler,
            # dependency and test failures in check annotations too.
            python3 - "$RUNNER_TEMP/openpath-android.log" <<'PY'
          import glob, pathlib, re, sys, xml.etree.ElementTree as ET
          text = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          interesting = []
          for name in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              try:
                  for case in ET.parse(name).iter('testcase'):
                      for failure in case.findall('failure'):
                          interesting.append(f"{case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
              except (ET.ParseError, OSError):
                  pass
          # GitHub accepts only ten error annotations per step. Prioritize the
          # compiler/test error and the concise Gradle cause, not task progress.
          interesting += [line.strip() for line in text if re.search(r'(^e: | error:| FAILED$)', line)]
          for i, line in enumerate(text):
              if 'What went wrong:' in line:
                  interesting += [item.strip() for item in text[i + 1:i + 6] if item.strip() and not item.startswith('* Try:')]
                  break
          interesting += [line.strip() for line in text if re.search(r'(FAILURE:|Could not|Caused by:)', line)]
          seen = set()
          for line in interesting:
              if line in seen: continue
              seen.add(line)
              line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:1500]
              print(f'::error title=Android build::{line}')
              if len(seen) >= 10: break
          PY
            exit "$status"
          fi
      - name: Sign a non-debuggable APK with an ephemeral test key
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-ci}"
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          APK=client/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"
          grep -q 'lib/arm64-v8a/libwg-go.so' "$RUNNER_TEMP/apk-list.txt"
          grep -q 'lib/x86_64/libwg-go.so' "$RUNNER_TEMP/apk-list.txt"
          keytool -genkeypair -keystore "$RUNNER_TEMP/openpath-test.jks" -storepass android -keypass android \
            -alias openpath-test -dname 'CN=OpenPath temporary test key' -keyalg RSA -keysize 3072 -validity 3650
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/openpath-aligned.apk"
          mkdir -p _android
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/openpath-test.jks" --ks-key-alias openpath-test \
            --ks-pass pass:android --key-pass pass:android \
            --out "_android/OpenPath-VPN-Android-${TAG}-test-signed.apk" "$RUNNER_TEMP/openpath-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "_android/OpenPath-VPN-Android-${TAG}-test-signed.apk"
          echo 'This non-debuggable APK uses a one-off TEST key. It is not a production release and later builds cannot update it in place.'
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-android-test-apk
          if-no-files-found: error
          path: _android/*.apk
