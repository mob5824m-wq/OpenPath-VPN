name: Release — Apps & Profiles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build all
        run: |
          ./scripts/build-all.sh

      - name: Build Linux AppImage (optional)
        continue-on-error: true
        run: |
          cd client/linux && npx electron-builder --linux AppImage --publish never || echo "AppImage skip"
          cd ../.. && ls -R client/linux/dist* 2>&1 | head -50 || true
          ls -R client/web/dist 2>&1 | head -20 || true
          ls server/dist 2>&1 | head -20 || true

      - name: Build web + server dist
        run: |
          cd client/web && npm run build 2>&1 | tail -20 || true
          cd ../../server && npm install && npx tsc --outDir dist 2>&1 | tail -10 || true

      - name: Prepare profile snapshot
        run: |
          mkdir -p _release/profiles
          # Snapshot current editable defaults + features catalog for this release
          cat client/core/src/profiles/profiles.ts 2>&1 | head -5 || true
          cat client/core/src/features/features.ts 2>&1 | head -5 || true
          # Copy for artifact so profiles are versioned per release
          cp -r client/core/src/profiles _release/profiles/ 2>&1 || true
          cp -r client/core/src/features _release/profiles/ 2>&1 || true
          echo "Release: ${GITHUB_REF_NAME:-manual}" > _release/profiles/RELEASE.txt
          date -u >> _release/profiles/RELEASE.txt
          ls -R _release 2>&1 | head -50

      - name: Pack artifacts
        run: |
          mkdir -p _release/artifacts
          # Server + web
          tar -czf _release/artifacts/openpath-server-${GITHUB_REF_NAME:-manual}.tar.gz server/dist 2>&1 | head -20 || true
          tar -czf _release/artifacts/openpath-web-${GITHUB_REF_NAME:-manual}.tar.gz client/web/dist 2>&1 | head -20 || true
          # Linux
          cp -r client/linux/dist* _release/artifacts/ 2>&1 || true
          cp -r _release/profiles _release/artifacts/profiles-${GITHUB_REF_NAME:-manual} 2>&1 || true
          # Profiles JSON snapshot
          jq -n --arg tag "${GITHUB_REF_NAME:-manual}" --arg date "$(date -u +%Y-%m-%d)" '{tag:$tag, date:$date, note:"Profiles + Features snapshot for this release"}' > _release/artifacts/profiles-release-${GITHUB_REF_NAME:-manual}.json 2>&1 || echo '{"tag":"manual"}' > _release/artifacts/profiles-release.json
          ls -lh _release/artifacts 2>&1 | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: OpenPath ${{ github.ref_name || inputs.tag }} — Apps & Profiles
          body: |
            ## OpenPath VPN ${{ github.ref_name || inputs.tag }}

            **Apps in this release:**
            - Server (Node) + Web PWA (Vite)
            - Linux GUI + CLI (deb/rpm/AppImage via electron-builder)
            - Windows NSIS (wintun.dll) — build on windows runner or local `client/desktop`
            - macOS DMG universal
            - Android AAR + APK
            - iOS PacketTunnel

            **Profiles in this release:**
            - Streaming US, Gaming, Anti-censorship, School (Canada), Home — each with editable color/icon/type/country/city + NetShield/Protocol/NAT/LAN/Connect&Go/Custom DNS
            - Features parity snapshot (38 features) included in `profiles-*.json`

            **How to update:**
            - Download artifact for your platform from Assets below
            - Native apps auto-check `GET https://api.github.com/repos/${{ github.repository }}/releases/latest`

            Auto-tag workflow bumped +0.1 on merge to main.
          files: |
            _release/artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: true
