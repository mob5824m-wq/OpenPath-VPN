name: Release — Apps

# Tags pushed with GITHUB_TOKEN do not emit a push event. The workflow_run
# trigger publishes the tag made by Auto Tag; manual tags and dispatch work too.
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["Auto Tag (bump .1 on merge)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (blank = newest tag)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        name: Resolve and validate the exact tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
          elif [ "$EVENT_NAME" = push ]; then
            TAG="$PUSH_TAG"
          else
            TAG=''
            if [ "$EVENT_NAME" = workflow_run ]; then
              mapfile -t CANDIDATES < <(git tag --points-at "$AUTO_SHA" -l 'v*' --sort=-v:refname)
            else
              mapfile -t CANDIDATES < <(git tag -l 'v*' --sort=-v:refname)
            fi
            for candidate in "${CANDIDATES[@]}"; do
              if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then TAG="$candidate"; break; fi
            done
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "No valid version tag found for this run: $TAG" >&2; exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  bundles:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/web/package-lock.json
      - name: Build and test server
        run: |
          set -euo pipefail
          npm ci --prefix server --no-audit --no-fund
          npm test --prefix server
          npm run build --prefix server
      - name: Build and test dashboard
        run: |
          set -euo pipefail
          npm ci --prefix client/web --no-audit --no-fund
          npm test --prefix client/web
          npm run typecheck --prefix client/web
          npm run build --prefix client/web
      - name: Create usable release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -e '
            let v = process.env.RELEASE_TAG.replace(/^v/, "").replace(/^(\d+\.\d+)(?=-|$)/, "$1.0");
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(v)) throw new Error("Invalid release version");
            process.stdout.write(v);
          ')
          npm --prefix server version "$VERSION" --no-git-tag-version --allow-same-version
          mkdir -p _release/artifacts _release/server _release/web
          cp -r server/dist _release/server/dist
          cp server/package.json server/package-lock.json _release/server/
          cat > _release/server/README.txt <<'TEXT'
          OpenPath server: npm ci --omit=dev, then node dist/index.js.
          To serve the web archive on the same origin, set WEB_DIST to the extracted web dist directory.
          Configure real credentials and secure the demo provisioning endpoints before public deployment.
          TEXT
          cp -r client/web/dist _release/web/dist
          cat > _release/web/README.txt <<'TEXT'
          OpenPath dashboard: serve dist with the OpenPath server by setting WEB_DIST to this dist directory.
          Alternatively configure your static host to proxy /api, /health, /ops and /fast to the backend.
          TEXT
          tar -czf "_release/artifacts/openpath-server-$RELEASE_TAG.tar.gz" -C _release/server .
          tar -czf "_release/artifacts/openpath-web-$RELEASE_TAG.tar.gz" -C _release/web .
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-release-bundles
          if-no-files-found: error
          path: _release/artifacts/*

  native:
    needs: resolve
    uses: ./.github/workflows/native-installers.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}

  publish:
    needs: [resolve, bundles, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openpath-release-bundles
          path: _release/artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: openpath-native-*
          merge-multiple: true
          path: _release/artifacts
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd _release/artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: OpenPath ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
          make_latest: ${{ contains(needs.resolve.outputs.tag, '-') && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## OpenPath ${{ needs.resolve.outputs.tag }}

            Downloads include the server, web UI testing preview, and native Qt Widgets installers for Linux x64, Windows x64, and macOS Intel/Apple Silicon. The desktop apps do not embed a browser. Android and iOS installers are not currently published by this workflow. Desktop builds are unsigned and macOS builds are not notarized.

            The device-wide WireGuard connection requires a separately configured WireGuard server, system tools and administrator permission. The WebSocket session is separate and does not route device traffic. See the repository documentation for DNS, routing and security limitations.

            Verify downloads with `SHA256SUMS.txt`. Profiles saved in the app remain local to that device.
          files: _release/artifacts/*
