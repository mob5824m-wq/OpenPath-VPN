name: Auto Tag (bump .1 on merge)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  bump-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the next version tag for this exact commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          while IFS= read -r existing; do
            if [[ "$existing" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "This commit already has tag $existing"
              exit 0
            fi
          done < <(git tag --points-at HEAD -l 'v*' --sort=-v:refname)
          LATEST=''
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then LATEST="$candidate"; break; fi
          done < <(git tag -l 'v*' --sort=-v:refname)
          if [ -z "$LATEST" ]; then
            TAG=v1.0
          else
            VERSION=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT=$((10#$MINOR + 1))
            if [ -n "${PATCH:-}" ]; then TAG="v$MAJOR.$NEXT.0"; else TAG="v$MAJOR.$NEXT"; fi
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite it" >&2; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG; the release workflow will build and publish it."
