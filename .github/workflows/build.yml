name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/web/package-lock.json
            client/linux/package-lock.json
            client/desktop/package-lock.json
      - name: Test and build server
        run: |
          set -euo pipefail
          npm ci --prefix server --no-audit --no-fund
          npm test --prefix server
          npm run build --prefix server
      - name: Test and build dashboard
        run: |
          set -euo pipefail
          npm ci --prefix client/web --no-audit --no-fund
          npm test --prefix client/web
          npm run typecheck --prefix client/web
          npm run build --prefix client/web
      - name: Test desktop and mobile layouts in Chromium
        working-directory: client/web
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm run test:responsive
      - name: Test legacy Linux renderer (not a release artifact)
        run: |
          set -euo pipefail
          npm ci --prefix client/linux --ignore-scripts --no-audit --no-fund
          npm test --prefix client/linux
          npm run build --prefix client/linux
      - name: Test legacy Electron shell (not a release artifact)
        run: |
          set -euo pipefail
          npm ci --prefix client/desktop --ignore-scripts --no-audit --no-fund
          npm test --prefix client/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: openpath-compiled-builds
          if-no-files-found: error
          path: |
            server/dist/**
            client/web/dist/**
